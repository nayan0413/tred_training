models:
 
 
  - name: dim_hosts_cleansed
    description: "This table derives data from source src hosts."
    tests:
      - minimum_row_count:
          min_row_count: 100
    columns: 
      - name: host_id
        description: "This represents the host id."
        tests: 
          - positive_values
          - unique
          - not_null
          - relationships:  
              to : ref('src_hosts')
              field : host_id
 
      - name: host_name
        description: "This represents the host name."
        tests: 
          - not_null
      - name: is_superhost
        description: "This represents if the host is a superhost."
        tests: 
          - not_null
          - accepted_values: 
              values: [true, false] 
              quote : false
      - name: created_at
        tests: 
          - not_null
      - name: updated_at
        tests: 
          - not_null


  - name: dim_listings_cleansed
    description: "This table derives data from source src listings."
    columns: 
      - name: listing_id
        description: "This represents the listing id."
        tests: 
          - unique
          - not_null
          - relationships:  
              to : ref('src_listings')
              field : listing_id
 
      - name: listing_url
        description: "This represents the listing_url."
        tests: 
          - not_null
      - name: listing_name
        description: "This represents the listing name."
        tests: 
          - not_null
        
      - name: created_at
        tests: 
          - not_null
      - name: updated_at
        tests: 
          - not_null  



  - name: dim_reviews_cleansed
    description: "This table derives data from source src reviews."
    columns: 
      - name: listing_id
        description: "This represents the listing id."
        tests: 
          - not_null
          - relationships:  
              to : ref('src_reviews')
              field : listing_id
 
      - name: reviewer_name
        description: "This represents the reviewer name."
        tests: 
          - not_null
      - name: review_date
        tests: 
          - not_null